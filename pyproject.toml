[project]
name = "discord-gemini-bot"
version = "0.1.0"
description = "Online Discord bot with Gemini AI chat and health-check server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "google-genai>=3.5.0",
    "aiohttp>=3.10.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

