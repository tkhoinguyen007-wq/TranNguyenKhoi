services:
  - type: web
    name: discord-gemini-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: BOT_SYSTEM_INSTRUCTION
        value: Bạn là một trợ lý AI thân thiện, hữu ích trong server Discord. Hãy trả lời rõ ràng, tự nhiên và súc tích bằng ngôn ngữ của người dùng.
